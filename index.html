<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Side-View Action RPG - 10 Hero Classes & Dungeons</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#09090b" />
    <!-- Installed from the home screen the game opens with no browser chrome at
         all. That is the only route to a genuinely permanent fullscreen: a page
         is not allowed to demand the screen on load, and iOS Safari has no
         Fullscreen API on iPhone whatsoever. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;600;700;800&family=Outfit:wght@500;700;800;900&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;600;700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        position: fixed;
        inset: 0;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        height: -webkit-fill-available;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
        background: #09090b;
        font-family: 'Outfit', 'Cinzel', 'Inter', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        cursor: url('/assets/kenney-rpg-ui/cursorSword_gold.png'), auto;
      }
      button, a, .hotbar-slot, .bag-slot, .equip-slot, .dialogue-btn, .inv-btn, .touch-action-btn, [role="button"], input {
        cursor: url('/assets/kenney-rpg-ui/cursorSword_gold.png'), pointer !important;
      }
      button:hover, a:hover, .hotbar-slot:hover, .bag-slot:hover, .equip-slot:hover, .dialogue-btn:hover, .inv-btn:hover {
        cursor: url('/assets/kenney-rpg-ui/cursorGauntlet_blue.png'), pointer !important;
      }
      #rpg {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        height: -webkit-fill-available;
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* Mobile portrait is a hard gate: the game root is not visible or
         interactive until the viewport is genuinely landscape. JavaScript
         applies the same state for mobile browsers whose media-query support
         is incomplete. */
      #orientation-rotate-shield {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999999;
        min-width: 100vw;
        min-height: 100vh;
        min-height: 100dvh;
        background:
          radial-gradient(circle at 50% 42%, rgba(107, 74, 146, 0.34), transparent 38%),
          linear-gradient(145deg, #17101f 0%, #08060c 58%, #030407 100%);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 12px;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        color: #f8fafc;
        user-select: none;
        touch-action: manipulation;
        pointer-events: auto;
      }

      #orientation-rotate-shield[hidden] { display: none !important; }
      html[data-landscape-blocked="true"] #orientation-rotate-shield { display: flex !important; }
      html[data-landscape-blocked="true"] #rpg { visibility: hidden; pointer-events: none; }

      /* This blocks the first paint on normal phones/tablets, before the module
         has loaded. The runtime detector handles iPad desktop UA and fallbacks. */
      @media screen and (max-width: 1100px) and (orientation: portrait) and (pointer: coarse),
             screen and (max-width: 1100px) and (orientation: portrait) and (hover: none) {
        #orientation-rotate-shield {
          display: flex !important;
        }
        #rpg { visibility: hidden; pointer-events: none; }
      }

      .rotate-phone-anim {
        width: 64px;
        height: 64px;
        border: 4px solid #ffd700;
        border-radius: 12px;
        margin-bottom: 8px;
        animation: rotateDevice 2.2s infinite ease-in-out;
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .rotate-phone-anim::after {
        content: '';
        width: 6px;
        height: 6px;
        background: #ffd700;
        border-radius: 50%;
        position: absolute;
        bottom: 6px;
      }

      @keyframes rotateDevice {
        0%, 15% {
          transform: rotate(0deg) scale(1);
        }
        50%, 75% {
          transform: rotate(90deg) scale(1.1);
        }
        100% {
          transform: rotate(90deg) scale(1);
        }
      }

      .rotate-title {
        font-family: 'Cinzel', serif;
        font-size: 20px;
        font-weight: 900;
        color: #ffd700;
        margin: 0 0 8px 0;
        letter-spacing: 2px;
        text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      }

      .rotate-desc {
        font-size: 13px;
        color: #cbd5e1;
        max-width: 380px;
        line-height: 1.5;
        font-weight: 600;
        margin: 0;
      }

      .rotate-action {
        min-width: min(300px, 82vw);
        min-height: 48px;
        margin-top: 6px;
        padding: 11px 18px;
        border: 1px solid rgba(255, 215, 0, 0.82);
        border-radius: 6px;
        color: #181007;
        background: linear-gradient(#ffe89a, #d9a82d);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,.22), 0 6px 20px rgba(0,0,0,.48);
        font: 900 .9rem/1 'Cinzel', serif;
        letter-spacing: .04em;
      }

      .rotate-status {
        min-height: 2.8em;
        max-width: 400px;
        margin: 0;
        color: #dacfb9;
        font-size: 12px;
        line-height: 1.4;
      }

      @media (prefers-reduced-motion: reduce) {
        .rotate-phone-anim { animation: none; transform: rotate(90deg); }
      }
    </style>
  </head>
  <body>
    <!-- Landscape Orientation Guide -->
    <div id="orientation-rotate-shield" role="dialog" aria-modal="true" aria-labelledby="orientation-title" aria-describedby="orientation-description orientation-lock-status">
      <div class="rotate-phone-anim" aria-hidden="true"></div>
      <h2 class="rotate-title" id="orientation-title">LANDSCAPE REQUIRED</h2>
      <p class="rotate-desc" id="orientation-description">This side-scrolling RPG only plays in landscape. Turn off Portrait Orientation Lock if needed, then rotate your phone or tablet.</p>
      <button class="rotate-action" id="orientation-enable-btn" type="button">Fullscreen &amp; Rotate</button>
      <p class="rotate-status" id="orientation-lock-status" role="status" aria-live="polite">Tap the button to let supported browsers enter fullscreen and request landscape.</p>
    </div>

    <div id="rpg"></div>
    <script src="/env.js"></script>
    <script type="module" src="./src/standalone.ts"></script>
  </body>
</html>
