databases:
  - name: rpgame-db
    plan: free
    databaseName: rpgame
    user: rpgame

services:
  - type: web
    name: rpgame-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpgame-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://rp-game-three.vercel.app
